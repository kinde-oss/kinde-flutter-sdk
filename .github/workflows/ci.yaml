name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  minimum_sdk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up minimum Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.1'
          cache: true

      - name: Get SDK dependencies
        run: flutter pub get --no-example

      - name: Analyze SDK
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings lib test

      - name: Test SDK
        run: flutter test --no-pub

  example_storage_compatibility:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare compatible example
        working-directory: example
        run: |
          cp .env.example .env
          flutter pub get

      - name: Analyze compatible example
        working-directory: example
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Test example storage compatibility
        working-directory: example
        run: flutter test --no-pub test/encrypted_box_test.dart

  analyze_and_test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
    steps:

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'
          cache-path: '${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:'

      - name: Get Dependencies
        run: flutter pub get

      - name: Analyze Code
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings --current-package

      - name: Run Tests
        run: flutter test --no-pub
